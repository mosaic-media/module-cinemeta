# The Cinemeta module's test container.
#
#   docker compose -f docker-compose.test.yml run --rm test
#
# This is the sanctioned way to run this repository's gates. Nothing is built
# or tested on the host.
#
# What the container is really asserting is the **boundary**: this module
# compiles against the published SDK and the standard library and nothing else,
# which boundary_test.go enforces by parsing every import. A host with a
# populated module cache, a leftover go.work or a stray `replace` can satisfy an
# import that a third party's machine could not — and the boundary test still
# passes, because the import resolved. Here the toolchain is pinned and the
# dependencies come from the proxy, exactly as a consumer resolves them.
#
# It matters more for this module than for an optional one: a core module shares
# the Platform's dependency graph (architecture#3), so anything that creeps in here
# every other core module has to live with.
#
# The tests are hermetic — the fake Cinemeta is an httptest server — so this
# needs no network beyond resolving the SDK.
#
# For a shell in the same environment:
#
#   docker compose -f docker-compose.test.yml run --rm test bash
name: mosaic-cinemeta-test

services:
  test:
    # Pinned to go.mod's `go` directive. Bump both together.
    image: golang:1.25-bookworm
    working_dir: /src/module-cinemeta
    environment:
      # The bind mount carries a .git the container has no business stat-ing,
      # and Go fails the build on its ownership rather than degrading.
      GOFLAGS: -buildvcs=false
    volumes:
      - .:/src/module-cinemeta
      - mosaic-cinemeta-gomod:/go/pkg/mod
      - mosaic-cinemeta-gobuild:/root/.cache/go-build
    command:
      - bash
      - -eu
      - -o
      - pipefail
      - -c
      - |
        # The decision-record checks. This image carries no interpreter of its
        # own, so install one if it is absent rather than assume either way —
        # a check that silently does not run is what this repository's gate
        # exists to prevent.
        command -v python3 >/dev/null || { apt-get update -qq && \
          apt-get install -y -qq --no-install-recommends python3 >/dev/null; }
        python3 scripts/adr_index.py --repo module-cinemeta --check
        python3 scripts/adr_lint.py --repo module-cinemeta --exclude 'scripts/adr_*.py'
        gofmt -l . > /tmp/unformatted
        if [ -s /tmp/unformatted ]; then
          echo "These files are not gofmt-clean:" >&2
          cat /tmp/unformatted >&2
          exit 1
        fi
        go build ./...
        go vet ./...
        go test ./...

volumes:
  mosaic-cinemeta-gomod:
  mosaic-cinemeta-gobuild:
